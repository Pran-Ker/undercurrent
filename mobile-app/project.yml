name: Undercurrent
options:
  bundleIdPrefix: com.hebbarpran
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"

packages:
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk.git
    exactVersion: 3.4.0

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Where the app finds the backend by default (the simulator, on this machine). A device build
    # passes BACKEND_URL=http://<your mac>.local:8790 on the command line; Settings overrides it on the phone.
    BACKEND_URL: "http://127.0.0.1:8790"
    # The key that backend was started with (UNDERCURRENT_API_KEY); empty for an open local one.
    # A device build passes BACKEND_KEY=… on the command line; Settings overrides it on the phone.
    BACKEND_KEY: ""

targets:
  Undercurrent:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Undercurrent
    dependencies:
      - package: ElevenLabs
        product: ElevenLabs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hebbarpran.undercurrent
        INFOPLIST_FILE: Sources/Undercurrent/Info.plist
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: match AppStore com.hebbarpran.undercurrent
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
          PROVISIONING_PROFILE_SPECIFIER: ""

  UndercurrentTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/UndercurrentTests
    dependencies:
      - target: Undercurrent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hebbarpran.undercurrent.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Undercurrent.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Undercurrent
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

  UndercurrentUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/UndercurrentUITests
    dependencies:
      - target: Undercurrent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hebbarpran.undercurrent.uitests
        TEST_TARGET_NAME: Undercurrent
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  Undercurrent:
    build:
      targets:
        Undercurrent: all
        UndercurrentTests: [test]
        UndercurrentUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UndercurrentTests
        - UndercurrentUITests
